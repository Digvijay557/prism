<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prism — Watch Mode Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --shadow-grey: #252323;
    --slate-grey: #70798c;
    --parchment: #f5f1ed;
    --bone: #dad2bc;
    --khaki-beige: #a99985;

    --r-1: #e0607a;
    --r-2: #e08a5c;
    --r-3: #e0c25c;
    --r-4: #6fbf8f;
    --r-5: #5c9ee0;
    --r-6: #7d6ee0;
    --r-7: #b56ed6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  body {
    font-family: 'Inter', -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Stage frame (mimics a phone viewport) ---------- */

  .stage {
    position: relative;
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
  }

  .bg-shot {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: none;
  }

  .stage.animation-bg {
    background: #000;
  }

  .stage.animation-bg .bg-shot {
    display: none;
  }

  .bg-dim {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0);
    transition: background 500ms ease;
    pointer-events: none;
  }

  .stage.dim-bg .bg-dim {
    background: rgba(0,0,0,0);
  }

  /* ---------- Floating triangle widget — docked to the right edge ---------- */

  .widget {
    position: absolute;
    right: 0;
    top: 54%;
    bottom: auto;
    transform: translateY(-50%);
    width: 64px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    opacity: 0;
    cursor: pointer;
    z-index: 5;
  }

  /* entrance/exit animations operate on this transform baseline */
  .widget {
    transform: translateY(-50%) scale(0);
  }

  .glow {
    position: absolute;
    right: -6px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    filter: blur(18px);
    opacity: 0;
    background: conic-gradient(
      from 0deg,
      var(--r-1), var(--r-2), var(--r-3), var(--r-4), var(--r-5), var(--r-6), var(--r-7), var(--r-1)
    );
    transition: opacity 400ms ease;
    pointer-events: none;
  }

  .widget.analyzing .glow {
    opacity: 0.85;
    animation: spectrum-spin 3.2s linear infinite, glow-breathe 1.8s ease-in-out infinite;
  }

  @keyframes spectrum-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes glow-breathe {
    0%, 100% { transform: scale(0.9); }
    50% { transform: scale(1.08); }
  }

  /* no circular shell anymore — just the triangle, docked to the edge */
  .triangle {
    position: relative;
    width: 0;
    height: 0;
    /* rotated 90deg: base-to-tip runs horizontally, tip points left into the screen */
    border-top: 16px solid transparent;
    border-bottom: 16px solid transparent;
    border-right: 26px solid #ffffff;
    filter: drop-shadow(-1px 1px 2px rgba(0,0,0,0.28));
    transition: transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .widget.analyzing .triangle {
    animation: none;
  }

  @keyframes triangle-breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .widget.idle-pulse .triangle {
    animation: idle-breathe 2.4s ease-in-out infinite;
  }

  @keyframes idle-breathe {
    0%, 100% { filter: drop-shadow(-2px 2px 3px rgba(0,0,0,0.35)); }
    50% { filter: drop-shadow(-2px 2px 8px rgba(0,0,0,0.55)); }
  }

  /* ---------- Card sheet ---------- */

  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 78%;
    overflow-y: auto;
    padding: 18px 18px 28px;
    z-index: 4;
    visibility: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 16px);
    mask-image: linear-gradient(to bottom, transparent 0, black 16px);
  }

  .sheet.show {
    visibility: visible;
  }

  .sheet::-webkit-scrollbar { display: none; }

  .sheet-handle {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 8px 0 14px;
  }

  .sheet-handle span {
    width: 40px;
    height: 4px;
    border-radius: 4px;
    background: var(--khaki-beige);
    display: block;
  }

  .wordmark-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 2px 14px;
  }

  .wordmark {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--parchment);
    text-shadow: 1px 1px 0 var(--khaki-beige), 2px 2px 0 var(--khaki-beige);
  }

  .wordmark-tag {
    font-size: 11px;
    color: var(--bone);
    opacity: 0.75;
  }

  .card {
    background: var(--bone);
    border: 2px solid var(--shadow-grey);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 3px 3px 0 var(--khaki-beige);
    opacity: 0;
    transform: translateY(24px) scale(0.96);
    transform-origin: 50% 100%;
  }

  .card.reveal {
    animation: card-reveal 620ms cubic-bezier(0.22, 1.26, 0.32, 1) forwards;
  }

  @keyframes card-reveal {
    0% { opacity: 0; transform: translateY(24px) scale(0.96); }
    60% { opacity: 1; transform: translateY(-3px) scale(1.01); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-label,
  .card h3 {
    font-size: 11px;
    color: var(--slate-grey);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .verdict-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
    border: 2px solid var(--shadow-grey);
  }

  .verdict-badge.worth { background: var(--r-4); color: #14261b; }
  .verdict-badge.selective { background: var(--r-3); color: #2e2609; }
  .verdict-badge.skip { background: var(--r-1); color: #2a0d13; }

  .verdict-reason,
  .card p {
    font-size: 14px;
    line-height: 1.55;
    color: var(--shadow-grey);
  }

  .topic-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .topic-list li {
    font-size: 13.5px;
    padding-left: 18px;
    position: relative;
    line-height: 1.45;
    color: var(--shadow-grey);
  }

  .topic-list.covered li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 7px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--r-4);
  }

  .skill-note {
    margin-top: 10px;
    font-size: 13px;
    color: var(--khaki-beige);
    font-weight: 600;
  }

  .timeline-track {
    display: flex;
    gap: 2px;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 12px;
    border: 2px solid var(--shadow-grey);
  }

  .timeline-segment { flex-grow: 1; height: 12px; }

  .timeline-segment.high { background: var(--r-4); }
  .timeline-segment.medium { background: var(--r-3); }
  .timeline-segment.low { background: var(--r-1); }

  .timeline-legend {
    display: flex;
    gap: 16px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--slate-grey);
  }

  .timeline-legend span::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 5px;
  }

  .timeline-legend .leg-high::before { background: var(--r-4); }
  .timeline-legend .leg-medium::before { background: var(--r-3); }
  .timeline-legend .leg-low::before { background: var(--r-1); }

  .timeline-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .timeline-item {
    display: flex;
    gap: 10px;
    font-size: 12.5px;
    align-items: baseline;
    color: var(--shadow-grey);
  }

  .timeline-time {
    color: var(--slate-grey);
    font-variant-numeric: tabular-nums;
    min-width: 38px;
  }
</style>
</head>

  <div class="sheet" id="sheet">
    <div class="sheet-handle"><span></span></div>
    <div class="wordmark-row">
      <span class="wordmark">PRISM</span>
      <span class="wordmark-tag">worth ur time</span>
    </div>
    <div id="cards"></div>
  </div>

<script>
  const cardsData = [
    {
      html: `
        <span class="verdict-badge worth">Worth Watching</span>
        <div class="verdict-reason">The video delivers a comprehensive, well-structured roadmap from beginner front-end basics to advanced full-stack and DevOps topics with practical, realistic learning advice.</div>
      `
    },
    {
      html: `
        <h3>Promise</h3>
        <p>A complete step-by-step web development roadmap from basics to advanced levels.</p>
      `
    },
    {
      html: `
        <h3>Reality — covered</h3>
        <ul class="topic-list covered">
          <li>Front-end, back-end, and database core roles explained via ChatGPT architecture example</li>
          <li>T-shaped learning strategy for web developers</li>
          <li>Front-end tech stack roadmap (HTML, CSS, JavaScript logic)</li>
          <li>AI tool integration strategy (delaying usage for 2-3 months to build core foundation)</li>
          <li>CSS framework selection logic (Bootstrap vs Tailwind in industry context)</li>
          <li>Back-end tech stack selection (Node.js vs Python/Django vs Java based on developer background)</li>
          <li>Core back-end concepts (APIs, MVC architecture, middleware, authentication)</li>
          <li>Database learning strategy (SQL vs NoSQL/MongoDB)</li>
          <li>Deployment options (Vercel/Render vs AWS/Azure)</li>
          <li>Full-stack resume project strategy using advanced features like WebSockets and WebRTC</li>
          <li>Advanced specialization topics (React, Docker, Kubernetes, Redis, CI/CD)</li>
        </ul>
      `
    },
    {
      html: `
        <h3>Depth</h3>
        <p>The video provides substantive guidance on structuring a web development learning path, backing up tech stack choices with clear industry rationale (such as explaining why beginners should start with Node.js or why Bootstrap remains heavily used over Tailwind in enterprise codebases).</p>
      `
    },
    {
      html: `
        <h3>Skill level fit</h3>
        <p>beginner</p>
      `
    },
    {
      html: `
        <h3>Time assessment</h3>
        <p>The 24-minute runtime is fully justified by covering every layer of the web development learning path with concrete recommendations and no fluff.</p>
      `
    },
    {
      html: (() => {
        const segs = [
          { start: 0,    end: 63,   label: "Introduction, target audience, and overview of learning resources", value: "high" },
          { start: 63,   end: 217,  label: "Explains front-end, back-end, and databases using a ChatGPT conceptual model", value: "high" },
          { start: 217,  end: 339,  label: "Front-end learning path covering HTML, CSS, and JavaScript core roles", value: "high" },
          { start: 339,  end: 465,  label: "Strategic advice on when to start using AI coding tools", value: "medium" },
          { start: 465,  end: 617,  label: "Building minor projects and selecting CSS frameworks (Bootstrap vs Tailwind)", value: "high" },
          { start: 617,  end: 650,  label: "Command line interface basics and version control with Git/GitHub", value: "medium" },
          { start: 650,  end: 804,  label: "Back-end roadmap: language selection logic (Node.js/Python/Java) and core concepts", value: "high" },
          { start: 804,  end: 866,  label: "Database roadmap: SQL vs NoSQL and interview preparation priorities", value: "high" },
          { start: 866,  end: 928,  label: "Deployment options: free hosting services vs enterprise cloud providers", value: "medium" },
          { start: 928,  end: 1116, label: "Full-stack project strategy incorporating complex tools like WebSockets", value: "high" },
          { start: 1116, end: 1302, label: "Advanced specializations (React, Docker, Kubernetes) and brief course plug", value: "medium" },
          { start: 1302, end: 1440, label: "Salary expectations, internship strategy, and closing advice", value: "low" }
        ];
        const totalEnd = segs[segs.length - 1].end;
        const track = segs.map(s => {
          const widthPct = ((s.end - s.start) / totalEnd) * 100;
          return `<div class="timeline-segment ${s.value}" style="flex-grow:${widthPct}"></div>`;
        }).join("");
        const fmt = (t) => {
          const m = Math.floor(t / 60);
          const sec = Math.floor(t % 60);
          return `${m}:${sec.toString().padStart(2, "0")}`;
        };
        const list = segs.map(s => `
          <div class="timeline-item">
            <span class="timeline-time">${fmt(s.start)}</span>
            <span>${s.label}</span>
          </div>
        `).join("");
        return `
          <h3>Valuable timeline</h3>
          <div class="timeline-track">${track}</div>
          <div class="timeline-legend">
            <span class="leg-high">High value</span>
            <span class="leg-medium">Medium</span>
            <span class="leg-low">Low value</span>
          </div>
          <div class="timeline-list">${list}</div>
        `;
      })()
    }
  ];

  const widget = document.getElementById("widget");
  const sheet = document.getElementById("sheet");
  const cardsEl = document.getElementById("cards");
  const stage = document.getElementById("stage");

  function delay(ms) {
    return new Promise(res => setTimeout(res, ms));
  }

  async function run() {
    // 1. Show the widget immediately
    await delay(0);
    stage.classList.add("animation-bg");

    // 2. Triangle fades + scales in (spring overshoot) — docked at right edge
    widget.animate(
      [
        { opacity: 0, transform: "translateY(-50%) scale(0)" },
        { opacity: 1, transform: "translateY(-50%) scale(1.08)", offset: 0.72 },
        { opacity: 1, transform: "translateY(-50%) scale(1)" }
      ],
      { duration: 400, easing: "cubic-bezier(0.34, 1.56, 0.64, 1)", fill: "forwards" }
    );
    await delay(400);

    // 3. Hold the visible widget for 10 seconds
    widget.classList.add("idle-pulse");
    await delay(10000);
    widget.classList.remove("idle-pulse");

    // 4. Tap — quick press animation
    await widget.animate(
      [
        { transform: "translateY(-50%) scale(1)" },
        { transform: "translateY(-50%) scale(0.86)", offset: 0.5 },
        { transform: "translateY(-50%) scale(1)" }
      ],
      { duration: 150, easing: "ease-out" }
    ).finished;

    // 5. Analyzing state — keep the animation visible for at least 10 seconds
    widget.classList.add("analyzing");
    stage.classList.add("dim-bg");
    await delay(10000);

    // 6. Reveal cards, fade out widget as first card appears
    stage.classList.remove("animation-bg");
    cardsData.forEach((c, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = c.html;
      card.style.animationDelay = `${i * 0.085}s`;
      cardsEl.appendChild(card);
    });
    sheet.classList.add("show");

    widget.style.display = "none";

    // trigger reveal animations on next frame
    requestAnimationFrame(() => {
      document.querySelectorAll(".card").forEach(c => c.classList.add("reveal"));
    });
  }

  run();
</script>
